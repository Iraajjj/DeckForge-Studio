name: DeckForge V4 quality gate
on:
  push:
  pull_request:
jobs:
  test:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install app and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite and coverage
        run: python -m pytest --cov=deckforge --cov-report=term-missing
      - name: CLI smoke test
        run: python -m deckforge --help
      - name: Generate sample data
        run: python -m deckforge demo ci_sample
      - name: Build reproducible review package
        run: python -m deckforge build ci_sample --strict
      - name: Verify SHA-256 manifest
        run: python -m deckforge verify ci_sample/build/deckforge_package.zip
